<div class="controls-container" style="display: flex; justify-content: center; align-items: flex-start; flex-direction: column; max-width: 700px; margin: 0 auto;">
  <div class="controls" style="border: 1px solid #ddd; padding: 16px; border-radius: 8px; background: #f9f9f9; margin-bottom: 24px; text-align: left; width: 100%;">
    <label for="rule-input" style="font-weight: bold; margin-right: 6px; display: inline-block; margin-top: 8px;">Rule (0-255):</label>
    <input type="text" id="rule-input" value="30" style="margin: 4px 0 8px; width: 100%; font-size: 1.2em; padding: 8px;"><br>

    <label for="initial-input" style="font-weight: bold; margin-right: 6px; display: inline-block; margin-top: 8px;">Initial Pattern:</label>
    <input type="text" id="initial-input" placeholder="e.g. 00111" style="margin: 4px 0 8px; width: 100%; font-size: 1.2em; padding: 8px;"><br>

    <div class="mode-toggle" style="margin: 10px 0;">
      <label style="font-weight: bold; margin-right: 6px;">Mode:</label>
      <input type="radio" name="mode" value="Binary" checked> Binary
      <input type="radio" name="mode" value="RuleIndex"> Rule Index
    </div>

    <div class="boundary-row" style="margin: 10px 0;">
      <input type="checkbox" id="toroidal-checkbox"> <label for="toroidal-checkbox" style="font-weight: bold; margin-right: 6px;">Toroidal Boundaries</label>
    </div>

    <label for="steps-slider" style="font-weight: bold; margin-right: 6px; display: inline-block; margin-top: 8px;">Generations:</label>
    <input type="range" id="steps-slider" min="1" max="500" value="100" style="margin: 8px 0; width: 100%;">
    <span id="steps-value">100</span><br><br>

    <button id="run-button" style="margin-top: 8px; cursor: pointer; background: #007bff; color: #fff; border: none; padding: 12px 24px; border-radius: 4px; font-size: 1.2em;">Run ECA</button>
  </div>

  <div id="canvas-container" style="display: flex; width: 100%; text-align: center;">
    <canvas id="ca-canvas" width="700" height="500" style="border: 1px solid #ddd;"></canvas>
    <div class="legend" style="width: 200px; text-align: left; margin-left: 20px;">
      <div class="binary-legend" style="display:none;">
        <h3>Binary Legend</h3>
        <div class="legend-item"><span class="legend-swatch" style="background:white; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 0 → white</div>
        <div class="legend-item"><span class="legend-swatch" style="background:black; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 1 → black</div>
      </div>

      <div class="ruleindex-legend" style="display:none;">
        <h3>Rule Index Legend</h3>
        <div class="legend-item"><span class="legend-swatch" style="background:white; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 0</div>
        <div class="legend-item"><span class="legend-swatch" style="background:black; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 1</div>
        <div class="legend-item"><span class="legend-swatch" style="background:red; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 2 → red</div>
        <div class="legend-item"><span class="legend-swatch" style="background:blue; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 3 → blue</div>
        <div class="legend-item"><span class="legend-swatch" style="background:green; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 4 → green</div>
        <div class="legend-item"><span class="legend-swatch" style="background:orange; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 5 → orange</div>
        <div class="legend-item"><span class="legend-swatch" style="background:purple; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 6 → purple</div>
        <div class="legend-item"><span class="legend-swatch" style="background:yellow; display:inline-block; width:20px; height:20px; border:1px solid #000;"></span> 7 → yellow</div>
      </div>
    </div>
  </div>
</div>
